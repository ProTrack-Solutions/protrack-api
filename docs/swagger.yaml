        in: query
        name: format
        type: string
        x-enum-varnames:
        - FormatJSON
        - FormatXLSX
        - FormatPDF
      - description: YYYY-MM-DD, inclusivo
        example: "2026-10-01"
        in: query
        name: start_date
        type: string
      - enum:
        - sales
        - sales_by_day
        - sales_by_payment_method
        - sales_by_seller
        - sales_by_customer
        - products_abc
        - profit_category
        - inventory
        - stock_movements
        - dre
        - payments_received
        - open_installments
        - bills_payable
        - cash_sessions
        example: sales
        in: query
        name: type
        required: true
        type: string
        x-enum-varnames:
        - ReportSales
        - ReportSalesByDay
        - ReportSalesByPaymentMethod
        - ReportSalesBySeller
        - ReportSalesByCustomer
        - ReportProductsABC
        - ReportProfitCategory
        - ReportInventory
        - ReportStockMovements
        - ReportDRE
        - ReportPaymentsReceived
        - ReportOpenInstallments
        - ReportBillsPayable
        - ReportCashSessions
