host: localhost:8080
info:
  contact:
    email: suporte@protrack.com
    name: Suporte ProTrack
  description: API de gerenciamento financeiro e comercial ProTrack Solutions.
  termsOfService: http://swagger.io/terms/
  title: ProTrack API
  version: "1.0"
paths:
  /accounts-receivable:
    get:
      parameters:
      - description: ID do cliente
        in: path
        name: customerId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ProTrack-Solutions_protrack-api_internal_accounts_receivable_domain.AccountsReceivableResponse'
      security:
      - BearerAuth: []
      summary: Resumo da dívida do cliente
      tags:
      - accounts-receivable
  /accounts-receivable/complete/list:
    get:
      description: Retorna a lista de contas a receber da empresa com base nos parâmetros
        de paginação enviados via query string.
      parameters:
      - description: EndDate filters records created until this date.
        example: "2024-12-31"
        in: query
        name: endDate
        type: string
      - in: query
        name: endDueDate
        type: string
      - enum:
        - due_date
        - created_at
        in: query
        name: orderField
        type: string
      - description: OrderBy defines the ordering direction for the results.
        enum:
        - asc
        - desc
        example: asc
        in: query
        name: orderBy
        type: string
      - description: Page is the page number to retrieve.
        example: 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: PerPage is the number of items per page.
        example: 10
        in: query
        minimum: 1
        name: perPage
        type: integer
      - in: query
        name: saleId
        type: string
      - description: Search filters the list by a text term.
        example: joao
        in: query
        name: search
        type: string
      - description: StartDate filters records created from this date.
        example: "2024-01-01"
        in: query
        name: startDate
        type: string
      - in: query
        name: startDueDate
        type: string
      - enum:
        - pending
        - paid
        - overdue
        - partial
        - cancelled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ProTrack-Solutions_protrack-api_internal_accounts_receivable_domain.ListAccountsReceivablesResponse'
        "400":
          description: Falha na validação dos parâmetros de paginação
          schema:
            additionalProperties: true
            type: object
        "401":
          description: company_id não encontrado na sessão
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista as contas a receber
      tags:
      - accounts-receivable
  /accounts-receivable/customer/{customerId}:
    get:
      parameters:
      - description: ID do cliente
        in: path
        name: customerId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ProTrack-Solutions_protrack-api_internal_accounts_receivable_domain.AccountsReceivableResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Contas a receber pendentes por cliente
      tags:
      - accounts-receivable
  /accounts-receivable/list:
    get:
