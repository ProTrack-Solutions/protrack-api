  /accounts-receivable/reminders/{id}:
    post:
      description: Parcela vencida usa o template de venda vencida; parcela a vencer
        usa o template de lembrete configurado na empresa. Respeita WhatsApp ativo,
        plano e limite de mensagens, e permite um lembrete por parcela a cada 24 horas.
      parameters:
      - description: ID da parcela (conta a receber)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ProTrack-Solutions_protrack-api_internal_receivable_reminders_domain.ReminderResponse'
        "404":
          description: Parcela não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Parcela quitada ou cancelada
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Sem template, cliente sem WhatsApp ou WhatsApp indisponível
            no plano
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Lembrete enviado há menos de 24 horas
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Falha no envio pela Meta
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Envia lembrete de cobrança pelo WhatsApp
      tags:
      - accounts-receivable
