        example: "2024-12-31"
        in: query
        name: endDate
        type: string
      - description: OrderBy defines the ordering direction for the results.
        enum:
        - asc
        - desc
        example: asc
        in: query
        name: orderBy
        type: string
      - description: Page is the page number to retrieve.
        example: 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: PerPage is the number of items per page.
        example: 10
        in: query
        minimum: 1
        name: perPage
        type: integer
      - description: Search filters the list by a text term.
        example: joao
        in: query
        name: search
        type: string
      - description: StartDate filters records created from this date.
        example: "2024-01-01"
        in: query
        name: startDate
        type: string
      - description: Status filters records by status when supported by the endpoint.
        enum:
        - active
        - inactive
        - all
        example: active
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
