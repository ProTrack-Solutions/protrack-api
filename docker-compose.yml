networks:
  protrack-net:
    external: true

volumes:
  redis_data:
  rabbitmq_data:

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-protrack
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: protrack
      RABBITMQ_DEFAULT_PASS: pr0tr@ck2026
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - protrack-net

  redis:
    image: redis:latest
    container_name: protrack-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - protrack-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: protrack-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-8080}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      EVOLUTION_KEY: ${EVOLUTION_KEY}
      EVOLUTION_API: http://evolution_api:8081
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - protrack-net

