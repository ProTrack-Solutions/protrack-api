name: CI/CD Pipeline - ProTrack API (Go)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # JOB 1: CI (Continuous Integration) - Validação, Lint & Testes Go
  # -------------------------------------------------------------
  go-ci:
    name: Go Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.2" # Ajuste para a versão do Go usada no seu go.mod
          cache: true

      - name: Baixar Dependências
        run: go mod download

      #- name: Verificar Formatação (gofmt)
      #  run: |
      #   if [ -n "$(gofmt -l .)" ]; then
      #     echo "Os seguintes arquivos precisam ser formatados com gofmt:"
      #     gofmt -l .
      #     exit 1
      #  fi

      - name: Executar Testes Unitários
        run: go test -v -race -cover ./...

  # -------------------------------------------------------------
  # JOB 2: Validação da Configuração do Docker
  # -------------------------------------------------------------
  # -------------------------------------------------------------
  # JOB 2: Validação da Configuração do Docker
  # -------------------------------------------------------------
  validate-docker:
    name: Validar Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Criar .env Dummy para Validação
        run: |
          touch .env
          echo "JWT_SECRET=test" >> .env
          echo "EVOLUTION_KEY=test" >> .env
          echo "EVOLUTION_API=test" >> .env
          echo "DB_USER=test" >> .env
          echo "DB_PASSWORD=test" >> .env
          echo "DB_HOST=test" >> .env
          echo "DB_NAME=test" >> .env

      - name: Linter no Compose
        run: docker compose config -q

  # -------------------------------------------------------------
  # JOB 3: CD (Continuous Deployment) - Disparo no Dokploy
  # -------------------------------------------------------------
deploy:
  name: Deploy no Dokploy
  needs: [go-ci, validate-docker]
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  runs-on: ubuntu-latest

  steps:
    - name: Disparar Deploy via API do Dokploy
      run: |
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.deploy" \
          -H "accept: application/json" \
          -H "Content-Type: application/json" \
          -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
          -d "{\"composeId\": \"${{ secrets.DOKPLOY_COMPOSE_ID }}\"}")

        if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
          echo "✅ Deploy iniciado com sucesso no Dokploy! (HTTP $RESPONSE)"
        else
          echo "❌ Erro ao disparar deploy no Dokploy. Código HTTP: $RESPONSE"
          exit 1
        fi
